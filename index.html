<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="theme-color" content="#3B82F6">
  <meta name="description" content="AutoCare · vehicle dashboard, maintenance, documents and fuel efficiency.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoCare">
  <title data-i18n="appTitle">Vehicle dashboard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 17v-5l2-5h12l2 5v5M3 17h18M4 12h16M6.5 14.5h.01M17.5 14.5h.01"/></symbol>
    <symbol id="i-fuel" viewBox="0 0 24 24"><path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h12M6 8h6M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5L3.5 17a2 2 0 0 0 3 3l5.7-5.8a4 4 0 0 0 5-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.3M12 18.2v2.3M3.5 12h2.3M18.2 12h2.3M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.3"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-tire" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4M9.5 12h5M9.5 16h5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.3v.01"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="acMark" x1="10" y1="5" x2="54" y2="59" gradientUnits="userSpaceOnUse"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#FB923C"/></linearGradient></defs>
          <path d="M32 5L54 13V30C54 43 45 53 32 59C19 53 10 43 10 30V13Z" fill="url(#acMark)" fill-opacity=".12" stroke="url(#acMark)" stroke-width="4" stroke-linejoin="round"/>
          <path d="M18 39L21 30Q22.5 27 26 27H38Q41.5 27 43 30L46 39Z" fill="url(#acMark)"/>
          <path d="M19 39h26" stroke="url(#acMark)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="23" cy="41" r="3.2" fill="#0A0D12" stroke="url(#acMark)" stroke-width="2"/>
          <circle cx="41" cy="41" r="3.2" fill="#0A0D12" stroke="url(#acMark)" stroke-width="2"/>
          <path d="M32 21v6m0 0h4" stroke="url(#acMark)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="brand-copy">
        <h1 class="wordmark">Auto<strong>Care</strong></h1>
        <p id="vName" class="vehicle-name">My car</p>
        <p class="app-subtitle" data-i18n="appSubtitle">Control dashboard</p>
      </div>
    </div>
    <div class="top-r">
      <label class="lang-wrap">
        <span class="sr-only" data-i18n="language">Language</span>
        <select id="langSel" class="lang-sel" data-i18n-aria="language" aria-label="Language">
          <option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option><option value="fr">FR</option>
          <option value="it">IT</option><option value="de">DE</option><option value="ru">RU</option><option value="ja">JA</option>
        </select>
      </label>
      <span class="sync" id="sync" title=""><i></i><b id="syncTx" style="font-weight:500" data-i18n="loading">Loading</b></span>
      <button class="icon-btn" data-act="settings" data-i18n-aria="settings" aria-label="Settings"><svg class="ico"><use href="#i-sliders"/></svg></button>
    </div>
  </header>

  <div class="demo" id="demo" hidden>
    <span data-i18n="demoNotice">You're viewing sample data. Your first entry replaces it.</span>
    <button class="btn sm" data-act="clear-demo" data-i18n="demoStart">Start with my data</button>
  </div>

  <nav class="mainnav" role="tablist" data-i18n-aria="navAria" aria-label="Dashboard sections">
    <button type="button" role="tab" id="tab-tablero" aria-controls="view-tablero" aria-selected="true" data-tab="tablero"><svg class="ico"><use href="#i-gauge"/></svg><span data-i18n="tabDashboard">Dashboard</span></button>
    <button type="button" role="tab" id="tab-mantenimiento" aria-controls="view-mantenimiento" aria-selected="false" data-tab="mantenimiento" tabindex="-1"><svg class="ico"><use href="#i-wrench"/></svg><span data-i18n="tabMaintenance">Maintenance &amp; Docs</span></button>
    <button type="button" role="tab" id="tab-analisis" aria-controls="view-analisis" aria-selected="false" data-tab="analisis" tabindex="-1"><svg class="ico"><use href="#i-sliders"/></svg><span data-i18n="tabAnalysis">Analysis &amp; History</span></button>
  </nav>

  <!-- Cada panel contiene solo sus propias tarjetas. #vehicleCard, #hero, #stats
       y #alerts pertenecen a #view-tablero: nunca deben salir de este section,
       porque es el panel completo el que se oculta al cambiar de pestaña. -->
  <main>
    <section class="view" id="view-tablero" role="tabpanel" aria-labelledby="tab-tablero">
      <section class="card a-vehicle" id="vehicleCard" data-i18n-aria="ariaVehicle" aria-label="Vehicle card"></section>
      <section class="card hero a-hero" id="hero" data-i18n-aria="ariaHero" aria-label="Odometer and efficiency gauge"></section>
      <section class="tiles a-stats" id="stats" data-i18n-aria="ariaStats" aria-label="Key indicators"></section>
      <div class="actions a-actions" data-i18n-aria="ariaActions" aria-label="Quick actions">
        <button type="button" class="act primary" data-act="add-fuel"><svg class="ico"><use href="#i-fuel"/></svg><span data-i18n="actFuel">Add fuel</span></button>
        <button type="button" class="act" data-act="add-exp"><svg class="ico"><use href="#i-wrench"/></svg><span data-i18n="actExp">Service or expense</span></button>
        <button type="button" class="act" data-act="add-odo"><svg class="ico"><use href="#i-gauge"/></svg><span data-i18n="actOdo">Update odometer</span></button>
      </div>
      <section class="a-alerts" id="alerts" data-i18n-aria="ariaAlerts" aria-label="Attention"></section>
    </section>

    <section class="view" id="view-mantenimiento" role="tabpanel" aria-labelledby="tab-mantenimiento" hidden>
      <section class="card a-rem" id="rems" data-i18n-aria="ariaReminders" aria-label="Preventive maintenance"></section>
      <section class="card a-docs" id="docs" data-i18n-aria="ariaDocs" aria-label="Documents and due dates"></section>
    </section>

    <section class="view" id="view-analisis" role="tabpanel" aria-labelledby="tab-analisis" hidden>
      <section class="card a-eff" id="eff" data-i18n-aria="ariaEff" aria-label="Efficiency per fill-up"></section>
      <section class="card a-spend" id="spend" data-i18n-aria="ariaSpend" aria-label="Spending per month"></section>
      <section class="card a-cats" id="cats" data-i18n-aria="ariaCats" aria-label="Where the money goes"></section>
      <section class="card a-hist" id="hist" data-i18n-aria="ariaHist" aria-label="Full history"></section>
    </section>
  </main>

  <p class="foot" id="foot"></p>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./js/i18n.js"></script>
<script src="./js/i18n/en.js"></script>
<script src="./js/i18n/es.js"></script>
<script src="./js/i18n/pt.js"></script>
<script src="./js/i18n/fr.js"></script>
<script src="./js/i18n/it.js"></script>
<script src="./js/i18n/de.js"></script>
<script src="./js/i18n/ru.js"></script>
<script src="./js/i18n/ja.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
